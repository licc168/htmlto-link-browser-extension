<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>htmlto.link</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="title">HTML<span class="accent">to</span>Link</span>
          <span class="version">v1.2.0</span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="setting-item">
        <label class="switch-row">
          <input type="checkbox" id="autoInjectToggle">
          <span class="switch-label" data-i18n="autoInjectLabel"></span>
        </label>
        <p class="hint" data-i18n="autoInjectHint"></p>
      </section>

      <section class="setting-item">
        <p id="accountStatus" class="account-status"></p>
        <a id="loginBtn" href="https://htmlto.link/settings" target="_blank" rel="noopener noreferrer" class="btn-primary" data-i18n="loginToKeep"></a>
        <p class="hint" data-i18n="loginHint"></p>
      </section>

      <details class="more-options">
        <summary data-i18n="advancedSettings"></summary>
        <section class="setting-item">
          <label for="serverInput" data-i18n="serverLabel"></label>
          <input type="text" id="serverInput" value="https://htmlto.link">
          <p class="hint" data-i18n="serverHint"></p>
        </section>

        <section class="setting-item">
          <label for="tokenInput" data-i18n="tokenLabel"></label>
          <input type="password" id="tokenInput" data-i18n-placeholder="tokenPlaceholder">
          <p class="hint" data-i18n="tokenHint"></p>
        </section>

        <button type="button" id="saveBtn" class="btn-primary" data-i18n="saveSettings"></button>
      </details>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
