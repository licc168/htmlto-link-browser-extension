<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>htmlto.link</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="title">HTML<span class="accent">to</span>Link</span>
          <span class="version">v1.1.0</span>
        </div>
      </div>
      <div class="server-badge" id="serverBadge">https://htmlto.link</div>
    </header>

    <!-- Auto-inject off banner -->
    <div id="autoInjectOffBanner" class="off-banner hidden">
      <span data-i18n="autoInjectOffHint"></span>
      <button type="button" id="reEnableBtn" class="re-enable-btn" data-i18n="reEnable"></button>
    </div>

    <!-- Navigation Tabs -->
    <nav class="tabs">
      <button type="button" class="tab-btn active" data-tab="paste" data-i18n="tabPaste"></button>
      <button type="button" class="tab-btn" data-tab="history" data-i18n="tabHistory"></button>
      <button type="button" class="tab-btn" data-tab="settings" data-i18n="tabSettings"></button>
    </nav>

    <!-- Main Content Panels -->
    <main class="content">
      <!-- Paste Code / Markdown Tab -->
      <section id="tab-paste" class="tab-panel active">
        <!-- Format Selector -->
        <div class="format-switcher">
          <button type="button" class="format-btn active" data-format="html" data-i18n="fmtHtml"></button>
          <button type="button" class="format-btn" data-format="md" data-i18n="fmtMarkdown"></button>
        </div>

        <!-- Markdown Template Selector (Visible only in MD mode) -->
        <div id="templateRow" class="form-row hidden">
          <div class="template-header">
            <label for="templateSelect" data-i18n="mdTemplateLabel"></label>
            <a id="editorPreviewLink" href="https://htmlto.link/editor" target="_blank" class="preview-link" data-i18n="previewTemplate"></a>
          </div>
          <select id="templateSelect" class="template-select">
            <option value="plain" selected data-i18n="tplPlain"></option>
            <option value="memo" data-i18n="tplMemo"></option>
            <option value="bytedance" data-i18n="tplBytedance"></option>
            <option value="darktech" data-i18n="tplDarktech"></option>
            <option value="coilnotebook" data-i18n="tplCoilnotebook"></option>
            <option value="traditionalchinese" data-i18n="tplTraditionalchinese"></option>
            <option value="popart" data-i18n="tplPopart"></option>
            <option value="warm" data-i18n="tplWarm"></option>
            <option value="alibaba" data-i18n="tplAlibaba"></option>
          </select>
        </div>

        <div class="form-group">
          <textarea id="codeInput" data-i18n-placeholder="codePlaceholder" spellcheck="false"></textarea>
        </div>
        <div class="form-row">
          <input type="text" id="filenameInput" data-i18n-placeholder="filenamePlaceholder" value="index.html">
        </div>
        <button type="button" id="publishBtn" class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 14h10"/><path d="M16 4h2a2 2 0 0 1 2 2v1.344"/><path d="m17 18 4-4-4-4"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"/><rect x="8" y="2" width="8" height="4" rx="1"/>
          </svg>
          <span id="publishBtnText" data-i18n="publishBtnText"></span>
        </button>

        <!-- Result Box -->
        <div id="resultCard" class="result-card hidden">
          <div class="result-header">
            <span class="success-tag" data-i18n="successTag"></span>
            <span id="resultTime" class="time-text"></span>
          </div>
          <div class="url-box">
            <input type="text" id="resultUrl" readonly>
            <button type="button" id="copyUrlBtn" data-i18n="copy" data-i18n-title="copy"></button>
          </div>
          <div class="result-actions">
            <a id="openUrlBtn" target="_blank" class="btn-link" data-i18n="openNewTab"></a>
          </div>
          <p class="expiry-notice" data-i18n="expiryNotice"></p>
        </div>
      </section>

      <!-- History Tab -->
      <section id="tab-history" class="tab-panel">
        <div id="historyList" class="history-list">
          <div class="empty-state" data-i18n="emptyHistory"></div>
        </div>
      </section>

      <!-- Settings Tab -->
      <section id="tab-settings" class="tab-panel">
        <div class="setting-item">
          <label class="switch-row">
            <input type="checkbox" id="autoInjectToggle">
            <span data-i18n="autoInjectLabel"></span>
          </label>
          <p class="hint" data-i18n="autoInjectHint"></p>
        </div>
        <div class="setting-item">
          <label for="serverInput" data-i18n="serverLabel"></label>
          <input type="text" id="serverInput" value="https://htmlto.link">
          <p class="hint" data-i18n="serverHint"></p>
        </div>
        <div class="setting-item">
          <label for="tokenInput" data-i18n="tokenLabel"></label>
          <input type="password" id="tokenInput" data-i18n-placeholder="tokenPlaceholder">
          <p class="hint" data-i18n="tokenHint"></p>
        </div>
        <button type="button" id="saveSettingsBtn" class="btn-secondary" data-i18n="saveSettings"></button>
      </section>
    </main>

    <!-- Footer Toast -->
    <div id="popupToast" class="popup-toast hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
