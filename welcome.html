<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>htmlto.link</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .card {
      width: 100%;
      max-width: 640px;
      padding: 40px 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: #fff;
      background: #2563eb;
      border-radius: 12px;
    }
    .brand-name { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-name b { color: var(--accent); font-weight: 900; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
    .steps { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
    .step {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .step-num {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: #2563eb;
      border-radius: 50%;
    }
    .step-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .step-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      background: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .note { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
    .demo-result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.08);
    }
    .demo-result.show { display: block; }
    .demo-label { font-size: 12px; font-weight: 700; color: var(--ok); margin-bottom: 8px; }
    .demo-url {
      width: 100%;
      padding: 8px 10px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--accent);
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .demo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .demo-actions a, .demo-actions button {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .error-text { display: none; margin-top: 12px; font-size: 13px; color: #fca5a5; text-align: center; }
    .error-text.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <div class="brand-name">HTML<b>to</b>Link</div>
    </div>

    <h1 data-i18n="welcomeTitle"></h1>
    <p class="subtitle" data-i18n="welcomeSubtitle"></p>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div>
          <div class="step-title" data-i18n="welcomePinTitle"></div>
          <div class="step-desc" data-i18n="welcomePinDesc"></div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>
          <div class="step-title" data-i18n="welcomeStep1Title"></div>
          <div class="step-desc" data-i18n="welcomeStep1Desc"></div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>
          <div class="step-title" data-i18n="welcomeStep2Title"></div>
          <div class="step-desc" data-i18n="welcomeStep2Desc"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="demoBtn" data-i18n="welcomePublishDemo"></button>
      <button type="button" class="btn btn-secondary" id="chatgptBtn" data-i18n="welcomeOpenChatgpt"></button>
    </div>

    <div id="demoResult" class="demo-result">
      <div class="demo-label" data-i18n="welcomeDemoSuccess"></div>
      <input id="demoUrl" class="demo-url" type="text" readonly>
      <div class="demo-actions">
        <button type="button" id="copyDemoBtn" data-i18n="copy"></button>
        <a id="openDemoBtn" target="_blank" rel="noopener noreferrer" data-i18n="openNewTab"></a>
        <a id="keepDemoBtn" target="_blank" rel="noopener noreferrer" data-i18n="keepLongTerm"></a>
      </div>
    </div>
    <p id="demoError" class="error-text"></p>
    <p class="note" data-i18n="welcomeNote"></p>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
