<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>htmlto.link</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(37, 99, 235, 0.25), transparent),
        var(--bg);
    }
    .card {
      width: 100%;
      max-width: 640px;
      padding: 40px 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: #fff;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
    }
    .brand-name { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-name b { color: var(--accent); font-weight: 900; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
    .steps { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
    .step {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .step-num {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      border-radius: 50%;
    }
    .step-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .step-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      border: none;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .note { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <div class="brand-name">HTML<b>to</b>Link</div>
    </div>

    <h1 data-i18n="welcomeTitle"></h1>
    <p class="subtitle" data-i18n="welcomeSubtitle"></p>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div>
          <div class="step-title" data-i18n="welcomeStep1Title"></div>
          <div class="step-desc" data-i18n="welcomeStep1Desc"></div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>
          <div class="step-title" data-i18n="welcomeStep2Title"></div>
          <div class="step-desc" data-i18n="welcomeStep2Desc"></div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>
          <div class="step-title" data-i18n="welcomeStep3Title"></div>
          <div class="step-desc" data-i18n="welcomeStep3Desc"></div>
        </div>
      </div>
    </div>

    <button type="button" class="btn" id="closeBtn" data-i18n="welcomeGotIt"></button>
    <p class="note" data-i18n="welcomeNote"></p>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
